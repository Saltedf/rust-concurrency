# 把 mdbook 教程自动构建并部署到 GitHub Pages
#
# 使用方法：
# 1. 在 GitHub 上创建一个仓库（比如 linux-sys-rs）
# 2. 把这个项目推上去：git remote add origin git@github.com:<你的用户名>/linux-sys-rs.git && git push -u origin main
# 3. 进仓库 Settings → Pages → Source 选 "GitHub Actions"
# 4. 下次 push 到 main 时，这个 workflow 会自动构建并部署
# 5. 你的教程会在 https://<你的用户名>.github.io/rust-concurrency/ 上线

name: Deploy mdbook to GitHub Pages

on:
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

# 设置 GitHub Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          cargo install mdbook --version 0.5.3 --locked

      - name: Build book
        run: mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
